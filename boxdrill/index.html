<title>Box Drill</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed drafting sheet (canvas) with a slim toolbar on top and a floating grade card. */
:root {
  --paper: #eef1f4;      /* cool drafting-film grey */
  --grid: #d9dfe6;
  --ink: #1d232b;
  --muted: #5d6874;
  --panel: #ffffff;
  --line: #c9d0d8;
  --accent: #1d232b;
  --set-l: #b86a00;      /* left-going edges */
  --set-r: #2463c9;      /* right-going edges */
  --set-v: #138a5b;      /* vertical edges */
  --good: #138a5b;
  --warn: #b7791f;
  --bad: #d42a2a;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15191e; --grid: #222830; --ink: #e6eaef; --muted: #96a1ad;
    --panel: #1d232a; --line: #333c47; --accent: #e6eaef;
    --set-l: #c4801f; --set-r: #4f8ced; --set-v: #2caa78;
    --good: #4fd39b; --warn: #f0b64f; --bad: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15191e; --grid: #222830; --ink: #e6eaef; --muted: #96a1ad;
  --panel: #1d232a; --line: #333c47; --accent: #e6eaef;
  --set-l: #c4801f; --set-r: #4f8ced; --set-v: #2caa78;
  --good: #4fd39b; --warn: #f0b64f; --bad: #ff6b6b;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 14px;
  overflow: hidden; display: flex; flex-direction: column;
}
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
  position: relative; z-index: 2;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.brand .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.progress { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.ticks { display: grid; grid-template-columns: repeat(12, 6px); gap: 2px; }
.ticks i { display: block; width: 6px; height: 14px; border-radius: 1px; background: var(--grid); }
.ticks i.on { background: var(--ink); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
button {
  font: 500 13px var(--f-body); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--set-r); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
kbd { font-family: var(--f-mono); font-size: 10px; color: var(--muted); margin-left: 4px; }
button.primary kbd { color: inherit; opacity: .6; }

main { position: relative; flex: 1; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
.hint {
  position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
  max-width: min(520px, calc(100% - 32px)); text-align: center; color: var(--muted);
  font-size: 13px; line-height: 1.45; pointer-events: none; text-wrap: balance;
}
.card {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(330px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 16px; display: grid; gap: 14px;
  box-shadow: 0 10px 30px rgb(0 0 0 / .12); max-height: calc(100% - 32px); overflow: auto;
}
.score { display: flex; align-items: flex-end; gap: 14px; }
.score .num { font-family: var(--f-display); font-weight: 800; font-size: 56px; line-height: .85; font-variant-numeric: tabular-nums; }
.score .letter { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; padding: 4px 9px; border-radius: 6px; border: 2px solid currentColor; }
.score .meta { font-size: 12px; color: var(--muted); line-height: 1.4; margin-left: auto; text-align: right; font-family: var(--f-mono); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.sets { display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 4px 10px; }
.set .chip { width: 10px; height: 10px; border-radius: 2px; }
.set .name { font-weight: 500; }
.set .vals { font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.set .bar { grid-column: 2 / 4; height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; }
.set .bar span { display: block; height: 100%; }
ul.tips { margin: 0; padding-left: 18px; display: grid; gap: 6px; line-height: 1.45; color: var(--ink); }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.history { display: grid; gap: 6px; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 34px; }
.spark span { flex: 1; max-width: 8px; background: var(--muted); border-radius: 1px 1px 0 0; opacity: .55; }
.spark span.last { background: var(--ink); opacity: 1; }
.hist-meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.linkish { border: none; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; }
.toast { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 6px; font-size: 13px; pointer-events: none; }
.viewchip {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 5px 5px 12px; font: 12px var(--f-mono); color: var(--muted);
}
.viewchip button { padding: 4px 9px; font-size: 12px; }
#prog {
  position: absolute; inset: 0; z-index: 3; overflow: auto; background: var(--paper);
  padding-block: 20px calc(32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.prog-inner { max-width: 960px; margin: 0 auto; display: grid; gap: 28px; }
.prog-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.prog-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 30px; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.prog-head .sub { color: var(--muted); font-size: 13px; }
.prog-head button { margin-left: auto; }
.banner { border: 1px solid var(--good); border-radius: 8px; padding: 12px 14px; line-height: 1.5; background: var(--panel); }
.banner strong { font-family: var(--f-display); font-size: 17px; display: block; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.tile .big { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .big small { font-size: 15px; color: var(--muted); font-weight: 500; }
.tile .note { font-size: 12px; color: var(--muted); font-family: var(--f-mono); line-height: 1.4; }
.meter { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.meter span { display: block; height: 100%; background: var(--ink); }
.up { color: var(--good); } .down { color: var(--bad); }
.chart { display: grid; gap: 8px; min-width: 0; }
.chart h3 { margin: 0; font-size: 15px; font-weight: 600; }
.chart .desc { color: var(--muted); font-size: 13px; margin: 0; max-width: 65ch; line-height: 1.45; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; display: inline-block; border-radius: 1px; }
.legend i.dot { width: 7px; height: 7px; border-radius: 50%; }
.plot { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.plot svg { display: block; width: 100%; }
.plot svg text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 6px 9px; font: 12px/1.45 var(--f-mono); white-space: nowrap; z-index: 2; }
.tbl-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: none; }
td .chip { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.thumb { display: grid; gap: 2px; padding: 6px; background: var(--panel); border-radius: 6px; text-align: left; }
.thumb svg { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; }
.thumb span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.thumb span b { color: var(--ink); font-weight: 500; }
.thumb.div span b::after { content: " ×"; color: var(--bad); }
.empty { color: var(--muted); line-height: 1.5; max-width: 60ch; }
.set .vals .dv { color: var(--bad); }
@media (max-width: 640px) {
  .card { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-height: 52%; padding: 12px; gap: 10px; }
  .score .num { font-size: 44px; }
  kbd { display: none; }
  .tools { margin-left: 0; }
  .viewchip { bottom: auto; top: 12px; }
  .hint { top: 56px; }
}
</style>

<header>
  <div class="brand"><h1>Box Drill</h1><span class="count" id="boxCount">box 1 / 250</span></div>
  <div class="progress" title="Edges drawn"><div class="ticks" id="ticks"></div><span id="lineCount">0/12</span></div>
  <div class="tools">
    <button id="undoBtn" type="button">Undo<kbd>Z</kbd></button>
    <button id="clearBtn" type="button">Clear<kbd>C</kbd></button>
    <button id="demoBtn" type="button">Sample box</button>
    <button id="progBtn" type="button">Progress<kbd>P</kbd></button>
    <button id="gradeBtn" class="primary" type="button">Grade<kbd>↵</kbd></button>
  </div>
</header>
<main id="stage">
  <canvas id="cv"></canvas>
  <div class="hint" id="hint"></div>
  <section class="card" id="card" hidden aria-live="polite"></section>
  <div class="viewchip" id="viewChip" hidden><span id="viewInfo"></span><button type="button" id="resetView">Reset view<kbd>0</kbd></button></div>
  <section id="prog" hidden aria-label="Progress"></section>
  <div class="toast" id="toast" hidden></div>
</main>

<script>
(() => {
'use strict';
const SET_INFO = {
  L: { name: 'Left set', css: '--set-l' },
  R: { name: 'Right set', css: '--set-r' },
  V: { name: 'Vertical set', css: '--set-v' },
};
const GOAL = 250;
const MIN_EDGE = 30; // px; anything shorter is a planning mark, not an edge
const STORE_KEY = 'boxdrill.v1';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const card = document.getElementById('card');
const hint = document.getElementById('hint');
const toastEl = document.getElementById('toast');
const prog = document.getElementById('prog');

const state = {
  lines: [],        // {pts, a, b, wobble, len}
  marks: [],        // planning dots/ticks: shorter than MIN_EDGE, never graded
  order: [],        // 'line' | 'mark', newest last, for undo
  current: null,
  result: null,
  sample: false,    // current drawing is a generated sample
  savedIndex: null, // history slot for this box
  zoom: null,       // {prev: view} while zoomed out to show the vanishing points
  view: { s: 1, r: 0, tx: 0, ty: 0 }, // paper -> screen (pan / zoom / rotate)
  penSeen: false,   // after a pen is used, one finger pans instead of drawing
  review: null,     // history index being re-graded
  confirmReset: false,
};

/* ---------- storage ---------- */
function loadHistory() {
  try { const v = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); return Array.isArray(v) ? v : []; }
  catch { return []; }
}
function saveHistory(h) { try { localStorage.setItem(STORE_KEY, JSON.stringify(h)); } catch {} }
let history = loadHistory();

/* ---------- geometry ---------- */
function fitStroke(pts) {
  const n = pts.length;
  let mx = 0, my = 0;
  for (const p of pts) { mx += p.x; my += p.y; }
  mx /= n; my /= n;
  let sxx = 0, syy = 0, sxy = 0;
  for (const p of pts) { const dx = p.x - mx, dy = p.y - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  const ang = 0.5 * Math.atan2(2 * sxy, sxx - syy);
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let tmin = Infinity, tmax = -Infinity, ss = 0;
  for (const p of pts) {
    const t = (p.x - mx) * dx + (p.y - my) * dy;
    const d = -(p.x - mx) * dy + (p.y - my) * dx;
    ss += d * d;
    if (t < tmin) tmin = t; if (t > tmax) tmax = t;
  }
  return {
    a: { x: mx + dx * tmin, y: my + dy * tmin },
    b: { x: mx + dx * tmax, y: my + dy * tmax },
    wobble: Math.sqrt(ss / n), len: tmax - tmin,
  };
}

// Eigenvector of the smallest eigenvalue of a symmetric 3x3 matrix (Jacobi).
function smallestEig(M) {
  const a = M.map(r => r.slice());
  const V = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  for (let sweep = 0; sweep < 60; sweep++) {
    const off = a[0][1] ** 2 + a[0][2] ** 2 + a[1][2] ** 2;
    if (off < 1e-24) break;
    for (const [p, q] of [[0, 1], [0, 2], [1, 2]]) {
      if (Math.abs(a[p][q]) < 1e-300) continue;
      const th = (a[q][q] - a[p][p]) / (2 * a[p][q]);
      const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th * th + 1));
      const c = 1 / Math.sqrt(t * t + 1), s = t * c;
      for (let k = 0; k < 3; k++) { const kp = a[k][p], kq = a[k][q]; a[k][p] = c * kp - s * kq; a[k][q] = s * kp + c * kq; }
      for (let k = 0; k < 3; k++) { const pk = a[p][k], qk = a[q][k]; a[p][k] = c * pk - s * qk; a[q][k] = s * pk + c * qk; }
      for (let k = 0; k < 3; k++) { const kp = V[k][p], kq = V[k][q]; V[k][p] = c * kp - s * kq; V[k][q] = s * kp + c * kq; }
    }
  }
  let i = 0;
  for (let k = 1; k < 3; k++) if (a[k][k] < a[i][i]) i = k;
  return [V[0][i], V[1][i], V[2][i]];
}

// Best-fit vanishing point (homogeneous, may be at infinity) minimising angular error.
function fitVP(L) {
  let w = L.map(() => 1), v = [0, 0, 1];
  for (let it = 0; it < 12; it++) {
    const M = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    L.forEach((ln, i) => {
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) M[r][c] += w[i] * ln.h[r] * ln.h[c];
    });
    v = smallestEig(M);
    w = L.map(ln => {
      const dx = v[0] - v[2] * ln.m[0], dy = v[1] - v[2] * ln.m[1];
      return 1 / Math.max(1e-6, dx * dx + dy * dy);
    });
  }
  return { v, errs: angErrs(L, v) };
}

// Angle (degrees) between each line and the ray from its midpoint to v.
function angErrs(L, v) {
  return L.map(ln => {
    const dx = v[0] - v[2] * ln.m[0], dy = v[1] - v[2] * ln.m[1];
    const dot = ln.h[0] * v[0] + ln.h[1] * v[1] + ln.h[2] * v[2];
    return Math.asin(Math.min(1, Math.abs(dot) / Math.max(1e-12, Math.hypot(dx, dy)))) * 180 / Math.PI;
  });
}

// Consensus vanishing point. A least-squares fit lets one stray edge drag the VP
// and spread its error over every edge. This uses a log loss, which keeps adding
// little for an edge that is already far off, so the VP settles where most edges
// agree and the stray edge carries its own error.
function robustVP(L) {
  const unit = (v) => { const n = Math.hypot(v[0], v[1], v[2]) || 1; return v.map(x => x / n); };
  const cands = [fitVP(L).v];
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const a = L[i].h, b = L[j].h;
    cands.push(unit([a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]));
  }
  if (L.length > 3) for (let skip = 0; skip < L.length; skip++) cands.push(fitVP(L.filter((_, k) => k !== skip)).v);
  const C = 0.5; // degrees
  const cost = (v) => angErrs(L, v).reduce((a, e) => a + Math.log(1 + e / C), 0);
  let best = cands[0], bestC = cost(best);
  for (const c of cands) { const k = cost(c); if (k < bestC) { best = c; bestC = k; } }
  // Polish with L1 reweighting from the best candidate.
  let v = best;
  for (let it = 0; it < 15; it++) {
    const e = angErrs(L, v);
    const M = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    L.forEach((ln, i) => {
      const dx = v[0] - v[2] * ln.m[0], dy = v[1] - v[2] * ln.m[1];
      const w = 1 / (Math.max(1e-6, dx * dx + dy * dy) * Math.max(0.05, e[i]) * (e[i] + C));
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) M[r][c] += w * ln.h[r] * ln.h[c];
    });
    v = smallestEig(M);
    const k = cost(v);
    if (k < bestC) { best = v; bestC = k; }
  }
  return { v: best, errs: angErrs(L, best) };
}

// Pairs of edges in a set that only ever get further apart on the way to the
// set's vanishing point: they meet behind the box, past the near ends of both
// edges. Edges that cross each other along the box (or meet ahead of it) still
// come together somewhere, so they count as plain convergence error, not this.
// The edge with the larger error in each pair takes the blame.
const DIV_MIN_ANGLE = 1;
const DIV_FACTOR = 2;  // diverging edges count double in the score // degrees between the pair; below this it's noise
function divergence(Lg, v, errs) {
  const out = { pairs: [], blamed: Lg.map(() => false) };
  if (Math.abs(v[2]) < 1e-9) return out;
  const P = [v[0] / v[2], v[1] / v[2]];
  if (Math.hypot(P[0], P[1]) > 40) return out; // nearly parallel set: no "toward" side
  const d = Lg.map(ln => {
    let ux = ln.b.x - ln.a.x, uy = ln.b.y - ln.a.y;
    const n = Math.hypot(ux, uy) || 1; ux /= n; uy /= n;
    if ((P[0] - ln.m[0]) * ux + (P[1] - ln.m[1]) * uy < 0) { ux = -ux; uy = -uy; }
    return [ux, uy];
  });
  for (let i = 0; i < Lg.length; i++) for (let j = i + 1; j < Lg.length; j++) {
    const ang = Math.acos(Math.min(1, Math.abs(d[i][0] * d[j][0] + d[i][1] * d[j][1]))) * 180 / Math.PI;
    if (ang < DIV_MIN_ANGLE) continue;
    const a = Lg[i].h, b = Lg[j].h;
    const X = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    if (Math.abs(X[2]) < 1e-12) continue;
    const x = X[0] / X[2], y = X[1] / X[2];
    const ti = (x - Lg[i].m[0]) * d[i][0] + (y - Lg[i].m[1]) * d[i][1];
    const tj = (x - Lg[j].m[0]) * d[j][0] + (y - Lg[j].m[1]) * d[j][1];
    const hi = Math.hypot(Lg[i].b.x - Lg[i].a.x, Lg[i].b.y - Lg[i].a.y) / 2;
    const hj = Math.hypot(Lg[j].b.x - Lg[j].a.x, Lg[j].b.y - Lg[j].a.y) / 2;
    if (!(ti < -hi && tj < -hj)) continue; // they meet along or ahead of the edges
    const k = errs[i] >= errs[j] ? i : j;
    out.blamed[k] = true;
    out.pairs.push({ i, j, x, y, blame: k, dir: [d[i], d[j]] });
  }
  return out;
}

function segIntersect(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 1e-12) return false;
  const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  return t > 0.02 && t < 0.98 && u > 0.02 && u < 0.98;
}

function* combos(arr, k, start = 0, acc = []) {
  if (acc.length === k) { yield acc.slice(); return; }
  for (let i = start; i <= arr.length - (k - acc.length); i++) {
    acc.push(arr[i]); yield* combos(arr, k, i + 1, acc); acc.pop();
  }
}

function analyze(lines) {
  // Normalise to box-centred units so the homogeneous fit is well conditioned.
  let cx = 0, cy = 0;
  for (const l of lines) { cx += l.a.x + l.b.x; cy += l.a.y + l.b.y; }
  cx /= lines.length * 2; cy /= lines.length * 2;
  let s = 0;
  for (const l of lines) s += (l.a.x - cx) ** 2 + (l.a.y - cy) ** 2 + (l.b.x - cx) ** 2 + (l.b.y - cy) ** 2;
  s = Math.sqrt(s / (lines.length * 2)) || 1;
  const N = (p) => ({ x: (p.x - cx) / s, y: (p.y - cy) / s });
  const L = lines.map(l => {
    const a = N(l.a), b = N(l.b);
    let h = [a.y - b.y, b.x - a.x, a.x * b.y - a.y * b.x];
    const n = Math.hypot(h[0], h[1]) || 1;
    h = h.map(x => x / n);
    return { a, b, h, m: [(a.x + b.x) / 2, (a.y + b.y) / 2] };
  });

  // Score every 4-line subset: convergence error plus a penalty when two lines
  // share a corner or cross (parallel box edges never do either).
  const cache = new Map();
  const groupCost = (g) => {
    const key = g.join(',');
    if (cache.has(key)) return cache.get(key);
    const fit = fitVP(g.map(i => L[i]));
    let cost = fit.errs.reduce((t, e) => t + e * e, 0);
    for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) {
      const A = L[g[i]], B = L[g[j]];
      const d = Math.min(Math.hypot(A.a.x - B.a.x, A.a.y - B.a.y), Math.hypot(A.a.x - B.b.x, A.a.y - B.b.y),
                         Math.hypot(A.b.x - B.a.x, A.b.y - B.a.y), Math.hypot(A.b.x - B.b.x, A.b.y - B.b.y));
      cost += 300 * Math.max(0, 1 - d / 0.25) ** 2;
      if (segIntersect(A.a, A.b, B.a, B.b)) cost += 300;
    }
    const r = { cost, fit };
    cache.set(key, r);
    return r;
  };
  const idx = [...Array(12).keys()];
  let best = null;
  for (const c1 of combos(idx.slice(1), 3)) {
    const g1 = [0, ...c1];
    const rem = idx.filter(i => !g1.includes(i));
    for (const c2 of combos(rem.slice(1), 3)) {
      const g2 = [rem[0], ...c2];
      const g3 = rem.filter(i => !g2.includes(i));
      const cost = groupCost(g1).cost + groupCost(g2).cost + groupCost(g3).cost;
      if (!best || cost < best.cost) best = { cost, groups: [g1, g2, g3] };
    }
  }

  const toScreen = (v) => {
    if (Math.abs(v[2]) < 1e-9) return null;
    const x = v[0] / v[2], y = v[1] / v[2];
    if (Math.hypot(x, y) > 400) return null; // effectively parallel
    return { x: x * s + cx, y: y * s + cy, dist: Math.hypot(x, y) };
  };
  const sets = best.groups.map(g => {
    // Grouping used the least-squares fit; scoring uses the consensus fit.
    const fit = robustVP(g.map(i => L[i]));
    const vp = toScreen(fit.v);
    // Mean direction (sign-aligned) for naming the set.
    let dx = 0, dy = 0;
    const d0 = { x: lines[g[0]].b.x - lines[g[0]].a.x, y: lines[g[0]].b.y - lines[g[0]].a.y };
    for (const i of g) {
      let ex = lines[i].b.x - lines[i].a.x, ey = lines[i].b.y - lines[i].a.y;
      const n = Math.hypot(ex, ey) || 1; ex /= n; ey /= n;
      if (ex * d0.x + ey * d0.y < 0) { ex = -ex; ey = -ey; }
      dx += ex; dy += ey;
    }
    const n = Math.hypot(dx, dy) || 1;
    const dirV = { x: fit.v[0], y: fit.v[1] };
    // Does the VP fall inside any of the drawn segments' spans? (lines cross before converging)
    let crossesInside = false;
    if (vp) for (const i of g) {
      const l = lines[i];
      const ex = l.b.x - l.a.x, ey = l.b.y - l.a.y, len2 = ex * ex + ey * ey;
      const t = ((vp.x - l.a.x) * ex + (vp.y - l.a.y) * ey) / len2;
      if (t > -0.05 && t < 1.05) crossesInside = true;
    }
    const mean = fit.errs.reduce((a, b) => a + b, 0) / 4;
    const dv = divergence(g.map(i => L[i]), fit.v, fit.errs);
    const divPairs = dv.pairs.map(pr => ({ a: g[pr.i], b: g[pr.j], blame: g[pr.blame], x: pr.x * s + cx, y: pr.y * s + cy }));
    return { lines: g, errs: fit.errs, div: dv.blamed, divPairs, mean, max: Math.max(...fit.errs), vp, dir: { x: dx / n, y: dy / n }, dirV, crossesInside, key: null };
  });

  // Name sets: most vertical first, then left/right by where their VP sits.
  const vi = sets.reduce((bi, st, i) => Math.abs(st.dir.y) > Math.abs(sets[bi].dir.y) ? i : bi, 0);
  sets[vi].key = 'V';
  const others = sets.filter((_, i) => i !== vi);
  const side = (st) => {
    if (st.vp) return st.vp.x - cx;
    return 0;
  };
  let [p, q] = others;
  let sp = side(p), sq = side(q);
  if (sp === sq) { // both parallel (or tie): left set is the one whose edges rise to the left
    sp = -Math.sign(p.dir.x) * Math.sign(p.dir.y || 1);
    sq = -sp;
  }
  if (sp <= sq) { p.key = 'L'; q.key = 'R'; } else { p.key = 'R'; q.key = 'L'; }
  const order = { L: 0, R: 1, V: 2 };
  sets.sort((a, b) => order[a.key] - order[b.key]);

  const lineInfo = new Array(12);
  sets.forEach(st => st.lines.forEach((li, k) => {
    // A diverging edge counts double: it breaks the box's depth, not just its precision.
    lineInfo[li] = { key: st.key, err: st.errs[k], div: st.div[k], eff: st.errs[k] * (st.div[k] ? DIV_FACTOR : 1) };
  }));
  sets.forEach(st => { st.eff = st.lines.reduce((t, li) => t + lineInfo[li].eff, 0) / 4; st.divCount = st.div.filter(Boolean).length; });
  const allErr = lineInfo.map(x => x.err);
  const mean = allErr.reduce((a, b) => a + b, 0) / 12;
  const effMean = lineInfo.reduce((a, x) => a + x.eff, 0) / 12;
  const divCount = lineInfo.filter(x => x.div).length;
  const worst = lineInfo.reduce((bi, x, i) => x.eff > lineInfo[bi].eff ? i : bi, 0);
  const wobble = lines.reduce((a, l) => a + l.wobble, 0) / 12;
  const score = Math.round(100 * Math.exp(-effMean / 6));
  return { sets, lineInfo, mean, effMean, divCount, worst, wobble, score, size: s, center: { x: cx, y: cy } };
}

function letterFor(score) {
  return score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : score >= 60 ? 'D' : 'F';
}
function scoreFromErr(e) { return Math.round(100 * Math.exp(-e / 6)); }

function tipsFor(r) {
  const tips = [];
  for (const st of r.sets) if (st.divCount) {
    const nm = SET_INFO[st.key].name;
    tips.push(st.divCount === 1
      ? `${nm}: the edge marked "diverges" only gets further from another edge in its set the further back they go; the two meet behind the box instead. They should get closer together. Diverging edges count double.`
      : `${nm}: ${st.divCount} edges diverge: they only get further apart the further back they go, meeting behind the box instead. They should get closer together. Diverging edges count double.`);
  }
  const worstSet = r.sets.reduce((a, b) => b.eff > a.eff ? b : a);
  if (r.score >= 90) tips.push('Clean convergence. Keep the same pace and try rotating the next box further.');
  else tips.push(`Your ${SET_INFO[worstSet.key].name.toLowerCase()} is the least consistent (${worstSet.mean.toFixed(1)}° average). Before each of those edges, check it against the others in its set.`);
  for (const st of r.sets) {
    const nm = SET_INFO[st.key].name;
    if (st.crossesInside && !st.divCount) tips.push(`${nm}: some of these edges cross each other along the box. Edges in a set should only meet at the vanishing point, out beyond the box.`);
    else if (!st.vp || st.vp.dist > 30) tips.push(`${nm}: these edges are nearly parallel. In 3-point perspective every set should converge a little.`);
    else if (st.vp.dist < 1.6) tips.push(`${nm}: the vanishing point is very close, which gives heavy distortion. Push it further out.`);
  }
  for (const st of r.sets) {
    const e = st.errs.slice().sort((a, b) => b - a);
    const nm = SET_INFO[st.key].name;
    if (st.divCount) continue;
    if (e[0] >= 1.5 && e[1] < e[0] / 3) tips.push(`${nm}: three edges agree on a vanishing point; the highlighted one misses it by ${e[0].toFixed(1)}°.`);
    else if (e[1] >= 1.5 && e[2] < e[1] / 3) tips.push(`${nm}: two edges agree and the other two head somewhere else (${e[1].toFixed(1)}° and ${e[0].toFixed(1)}° off). Check every new edge against all the others in its set, not just its neighbour on the same face.`);
  }
  if (r.lineInfo[r.worst].err > 3) tips.push(`The worst edge is off by ${r.lineInfo[r.worst].err.toFixed(1)}°. Ghost the stroke a few times before committing.`);
  if (r.wobble > 2.2) tips.push(`Average wobble is ${r.wobble.toFixed(1)}px. Draw from the shoulder and commit to speed; a slight curve is fine, hesitation is not.`);
  return tips.slice(0, 6);
}

/* ---------- sample box ---------- */
function rand(a, b) { return a + Math.random() * (b - a); }
function sampleBox(noise = 1) {
  const r = stage.getBoundingClientRect();
  const W = r.width, H = r.height;
  const cx = W * 0.42, cy = H * 0.5;
  const size = Math.min(W, H) * 0.16;
  const yaw = rand(25, 65) * Math.PI / 180;
  const pitch = (Math.random() < 0.5 ? -1 : 1) * rand(18, 35) * Math.PI / 180;
  const roll = rand(-6, 6) * Math.PI / 180;
  const D = rand(3.2, 5);
  const rot = (p) => {
    let [x, y, z] = p;
    [x, z] = [x * Math.cos(yaw) + z * Math.sin(yaw), -x * Math.sin(yaw) + z * Math.cos(yaw)];
    [y, z] = [y * Math.cos(pitch) - z * Math.sin(pitch), y * Math.sin(pitch) + z * Math.cos(pitch)];
    [x, y] = [x * Math.cos(roll) - y * Math.sin(roll), x * Math.sin(roll) + y * Math.cos(roll)];
    return [x, y, z + D];
  };
  const verts = [];
  for (let i = 0; i < 8; i++) verts.push([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1]);
  const P = verts.map(rot).map(([x, y, z]) => ({ x: cx + size * D * x / z, y: cy - size * D * y / z }));
  const lines = [];
  for (let i = 0; i < 8; i++) for (const bit of [1, 2, 4]) {
    const j = i | bit; if (j === i) continue;
    let a = P[i], b = P[j];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    const ang = Math.atan2(b.y - a.y, b.x - a.x) + rand(-1.2, 1.2) * noise * Math.PI / 180;
    const m = { x: (a.x + b.x) / 2 + rand(-2, 2) * noise, y: (a.y + b.y) / 2 + rand(-2, 2) * noise };
    const ext0 = len / 2 + rand(-3, 8), ext1 = len / 2 + rand(-3, 8);
    a = { x: m.x - Math.cos(ang) * ext0, y: m.y - Math.sin(ang) * ext0 };
    b = { x: m.x + Math.cos(ang) * ext1, y: m.y + Math.sin(ang) * ext1 };
    const pts = [], n = Math.max(8, Math.round(len / 6)), bow = rand(-1.5, 1.5);
    for (let k = 0; k <= n; k++) {
      const t = k / n, off = bow * Math.sin(Math.PI * t) + rand(-0.4, 0.4);
      pts.push({ x: a.x + (b.x - a.x) * t - Math.sin(ang) * off, y: a.y + (b.y - a.y) * t + Math.cos(ang) * off });
    }
    lines.push({ pts, ...fitStroke(pts) });
  }
  // shuffle so stroke order carries no hints
  for (let i = lines.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [lines[i], lines[j]] = [lines[j], lines[i]]; }
  return lines;
}

/* ---------- actions ---------- */
function grade() {
  if (state.lines.length !== 12) {
    toast(state.lines.length < 12 ? `Draw all 12 edges first (${state.lines.length}/12).` : `That's ${state.lines.length} lines. Undo the extras so there are exactly 12.`);
    return;
  }
  state.result = analyze(state.lines);
  if (!state.sample && state.review == null) {
    const r = state.result;
    const xs = state.lines.flatMap(l => [l.a.x, l.b.x]), ys = state.lines.flatMap(l => [l.a.y, l.b.y]);
    const ox = Math.min(...xs), oy = Math.min(...ys);
    const entry = {
      score: r.score, err: +r.mean.toFixed(2), t: Date.now(), div: r.divCount, wob: +r.wobble.toFixed(1),
      sets: Object.fromEntries(r.sets.map(st => [st.key, +st.mean.toFixed(2)])),
      seg: state.lines.flatMap(l => [l.a.x - ox, l.a.y - oy, l.b.x - ox, l.b.y - oy].map(Math.round)),
      k: r.lineInfo.map(x => x.key).join(''),
    };
    if (state.savedIndex == null) { history.push(entry); state.savedIndex = history.length - 1; }
    else history[state.savedIndex] = entry;
    saveHistory(history);
  }
  update();
}
function undo() {
  if (state.review != null) { clearAll(); return; }
  leaveVPView();
  if (state.result) { state.result = null; }
  else if (state.order.pop() === 'mark') state.marks.pop();
  else state.lines.pop();
  if (state.sample && !state.lines.length) state.sample = false;
  update();
}
function clearAll() {
  leaveVPView();
  state.lines = []; state.marks = []; state.order = []; state.result = null; state.sample = false; state.savedIndex = null; state.review = null;
  update();
}
function showSample() {
  clearAll();
  state.view = { s: 1, r: 0, tx: 0, ty: 0 };
  state.lines = sampleBox(); state.sample = true;
  grade();
}
function toggleZoom() {
  if (state.zoom) { leaveVPView(); update(); return; }
  if (!state.result) return;
  state.zoom = { prev: { ...state.view } };
  fitVPView(); update();
}
function nextBox() { clearAll(); }

let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2600);
}

/* ---------- view (pan / zoom / rotate) ---------- */
// World coordinates are the paper; the view maps paper to screen:
// screen = t + s * R(r) * world.
const MIN_S = 0.1, MAX_S = 8;
function viewIsIdentity(v = state.view) { return Math.abs(v.s - 1) < 0.005 && Math.abs(v.r) < 1e-4 && Math.abs(v.tx) < 0.5 && Math.abs(v.ty) < 0.5; }
function toScreen(p, v = state.view) {
  const c = Math.cos(v.r), sn = Math.sin(v.r);
  return { x: v.tx + v.s * (c * p.x - sn * p.y), y: v.ty + v.s * (sn * p.x + c * p.y) };
}
function toWorld(q, v = state.view) {
  const c = Math.cos(v.r), sn = Math.sin(v.r);
  const x = (q.x - v.tx) / v.s, y = (q.y - v.ty) / v.s;
  return { x: c * x + sn * y, y: -sn * x + c * y };
}
// View with scale s and rotation r that puts world point w at screen point p.
function anchorView(s, r, w, p) {
  const c = Math.cos(r), sn = Math.sin(r);
  return { s, r, tx: p.x - s * (c * w.x - sn * w.y), ty: p.y - s * (sn * w.x + c * w.y) };
}
function normAngle(r) { r = r % (2 * Math.PI); if (r > Math.PI) r -= 2 * Math.PI; if (r <= -Math.PI) r += 2 * Math.PI; return r; }
function snapAngle(r) { // snap to square within 3°
  r = normAngle(r);
  for (const k of [-Math.PI, -Math.PI / 2, 0, Math.PI / 2, Math.PI]) if (Math.abs(r - k) < 3 * Math.PI / 180) return normAngle(k);
  return r;
}
function clampS(s) { return Math.min(MAX_S, Math.max(MIN_S, s)); }
function leaveVPView() { if (state.zoom) { state.view = state.zoom.prev; state.zoom = null; } }
function resetView() { state.zoom = null; state.view = { s: 1, r: 0, tx: 0, ty: 0 }; update(); }

function fitVPView() {
  const r = state.result; if (!r) return;
  const rect = stage.getBoundingClientRect();
  const rot = state.zoom.prev.r, c = Math.cos(rot), sn = Math.sin(rot);
  const pts = [];
  for (const l of state.lines) pts.push(l.a, l.b);
  for (const st of r.sets) if (st.vp && st.vp.dist < 40) pts.push(st.vp);
  const q = pts.map(p => ({ x: c * p.x - sn * p.y, y: sn * p.x + c * p.y }));
  const minX = Math.min(...q.map(p => p.x)), maxX = Math.max(...q.map(p => p.x));
  const minY = Math.min(...q.map(p => p.y)), maxY = Math.max(...q.map(p => p.y));
  // Fit into the part of the sheet the grade card doesn't cover.
  const pad = 40, top = 64;
  const narrow = rect.width <= 640;
  const right = narrow ? rect.width : rect.width - 362;
  const bottom = narrow ? rect.height * 0.46 : rect.height;
  const aw = right - pad * 2, ah = bottom - top - pad;
  const s = Math.max(0.02, Math.min(state.zoom.prev.s, aw / (maxX - minX || 1), ah / (maxY - minY || 1)));
  state.view = { s, r: rot, tx: pad + aw / 2 - s * (minX + maxX) / 2, ty: top + ah / 2 - s * (minY + maxY) / 2 };
}

/* ---------- input ---------- */
// One finger, mouse or pen draws. Two fingers pinch-zoom, pan and rotate.
// Once a pen has been used, a single finger pans instead of drawing.
let drawing = null;   // {id, type, pts} | {id, kind:'exitvp'|'blocked'}
let gesture = null;   // {ids:[a,b], w:[world a, world b]}
let panning = null;   // {id, w}
let spaceDown = false;
const pointers = new Map();
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

function startGesture() {
  const ids = [...pointers.keys()].filter(id => pointers.get(id).type === 'touch').slice(0, 2);
  leaveVPView();
  gesture = { ids, w: ids.map(id => toWorld(pointers.get(id))) };
}
function applyGesture() {
  const [p1, p2] = gesture.ids.map(id => pointers.get(id));
  const [w1, w2] = gesture.w;
  const dw = Math.hypot(w2.x - w1.x, w2.y - w1.y), dp = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  if (dw < 1e-3 || dp < 1) return;
  const s = clampS(dp / dw);
  const r = snapAngle(Math.atan2(p2.y - p1.y, p2.x - p1.x) - Math.atan2(w2.y - w1.y, w2.x - w1.x));
  state.view = anchorView(s, r, { x: (w1.x + w2.x) / 2, y: (w1.y + w2.y) / 2 }, { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 });
  render(); updateViewChip();
}

cv.addEventListener('pointerdown', (e) => {
  const p = pos(e);
  pointers.set(e.pointerId, { x: p.x, y: p.y, type: e.pointerType });
  cv.setPointerCapture(e.pointerId);
  e.preventDefault();
  if (e.pointerType === 'pen') state.penSeen = true;

  const touches = [...pointers.values()].filter(q => q.type === 'touch').length;
  if (e.pointerType === 'touch' && touches >= 2) {
    if (drawing && drawing.type === 'touch') { drawing = null; state.current = null; }
    if (drawing && drawing.kind) drawing = null;
    panning = null;
    startGesture();
    return;
  }
  const mousePan = e.pointerType === 'mouse' && (e.button === 1 || (e.button === 0 && spaceDown));
  if (mousePan || (e.pointerType === 'touch' && state.penSeen)) {
    leaveVPView();
    panning = { id: e.pointerId, w: toWorld(p) };
    return;
  }
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  if (state.zoom) { drawing = { id: e.pointerId, kind: 'exitvp' }; return; }
  if (state.result && !(state.sample || state.review != null)) { drawing = { id: e.pointerId, kind: 'blocked' }; return; }
  drawing = { id: e.pointerId, type: e.pointerType, pts: [toWorld(p)], clearFirst: state.sample || state.review != null };
  state.current = drawing.pts;
});
cv.addEventListener('pointermove', (e) => {

  for (const e of ends) svg += `<text x="${e.x + 8}" y="${e.y + 4}" style="fill:var(--ink)">${e.label}</text>`;
  svg += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink)" stroke-width="1" opacity="0"/>`;
  svg += `<rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = svg;
  const svgEl = el.querySelector('svg'), tipEl = el.querySelector('.tip'), xh = el.querySelector('.xh');
  const move = (e) => {
    const r = svgEl.getBoundingClientRect();
    const px = (e.clientX - r.left) * W / r.width;
    const i = Math.round((px - m.l) / (W - m.l - m.r) * (xMax - 1));
    if (i < 0 || i >= n) { tipEl.hidden = true; xh.setAttribute('opacity', 0); return; }
    xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('opacity', .35);
    tipEl.innerHTML = tip(i); tipEl.hidden = false;
    const left = X(i) * r.width / W;
    tipEl.style.top = '8px';
    tipEl.style.left = (left > r.width / 2 ? left - tipEl.offsetWidth - 10 : left + 10) + 'px';
  };
  svgEl.addEventListener('pointermove', move);
  svgEl.addEventListener('pointerleave', () => { tipEl.hidden = true; xh.setAttribute('opacity', 0); });
}

function renderProgress() {
  const n = history.length;
  const H = history;
  let html = `<div class="prog-inner">
    <div class="prog-head"><h2>Your boxes</h2>
      <span class="sub">${n ? `${n} graded${n >= GOAL ? `, challenge of ${GOAL} complete` : `, ${GOAL - n} to go`}` : 'Nothing graded yet'}</span>
      <button type="button" id="closeProg">Back to drawing<kbd>P</kbd></button></div>`;
  if (!n) {
    html += `<p class="empty">Every box you grade lands here: your score over time, which set of edges needs the most work, how often edges diverge, and a gallery of every box you can reopen and re-check. The sample box doesn't count.</p></div>`;
    prog.innerHTML = html; wireProg(); return;
  }
  const w = Math.min(25, Math.max(1, Math.floor(n / 2)));
  const first = H.slice(0, w), last = H.slice(-w);
  const fScore = avgOf(first.map(h => h.score)), lScore = avgOf(last.map(h => h.score));
  const fErr = avgOf(first.map(h => h.err)), lErr = avgOf(last.map(h => h.err));
  const withDiv = (arr) => arr.filter(h => h.div != null);
  const fDiv = avgOf(withDiv(first).map(h => h.div)), lDiv = avgOf(withDiv(last).map(h => h.div));
  const recent = H.slice(-25), recentAvg = Math.round(avgOf(recent.map(h => h.score)));

  if (n >= GOAL) {
    const a = H.slice(0, 25), b = H.slice(GOAL - 25, GOAL);
    html += `<div class="banner"><strong>${GOAL} boxes done.</strong>
      Boxes 1–25 averaged ${Math.round(avgOf(a.map(h => h.score)))} (${avgOf(a.map(h => h.err)).toFixed(2)}° mean error);
      boxes ${GOAL - 24}–${GOAL} averaged ${Math.round(avgOf(b.map(h => h.score)))} (${avgOf(b.map(h => h.err)).toFixed(2)}°).
      ${n > GOAL ? `You've drawn ${n - GOAL} more since; they're tracked below.` : 'Boxes you draw from here on keep adding to the charts.'}</div>`;
  }

  const delta = n >= 2 ? Math.round(lScore - fScore) : null;
  const arrow = (d, goodIfUp = true) => d == null || d === 0 ? '' : `class="${(d > 0) === goodIfUp ? 'up' : 'down'}"`;
  html += `<div class="tiles">
    <div class="tile"><span class="label">Boxes</span><span class="big">${n}<small> / ${GOAL}</small></span>
      <div class="meter"><span style="width:${Math.min(100, n / GOAL * 100)}%"></span></div></div>
    <div class="tile"><span class="label">Recent average</span><span class="big">${recentAvg}<small> ${letterFor(recentAvg)}</small></span>
      <span class="note">last ${recent.length} box${recent.length > 1 ? 'es' : ''}</span></div>
    <div class="tile"><span class="label">Change</span><span class="big" ${arrow(delta)}>${delta == null ? '–' : (delta > 0 ? '+' : '') + delta}<small> pts</small></span>
      <span class="note">${n >= 2 ? `first ${w} → last ${w}: ${Math.round(fScore)} → ${Math.round(lScore)}<br>error ${fErr.toFixed(2)}° → ${lErr.toFixed(2)}°` : 'needs 2 boxes'}</span></div>
    <div class="tile"><span class="label">Diverging edges</span><span class="big" ${lDiv != null && fDiv != null ? arrow(lDiv - fDiv, false) : ''}>${lDiv == null ? '–' : lDiv.toFixed(1)}<small> per box</small></span>
      <span class="note">${lDiv != null && fDiv != null && n >= 2 ? `first ${w}: ${fDiv.toFixed(1)} per box` : 'recent boxes'}</span></div>
  </div>`;

  html += `<div class="chart"><h3>Score per box</h3>
    <p class="desc">Each dot is one box; the line is your 10-box rolling average. Grade lines at 90 (A), 80, 70 and 60.</p>
    <div class="legend"><span><i class="dot" style="background:var(--muted)"></i>Box score</span><span><i style="background:var(--ink)"></i>10-box average</span></div>
    <div class="plot" id="chScore"></div></div>`;
  const hasSets = H.some(h => h.sets);
  if (hasSets) html += `<div class="chart"><h3>Convergence error by set</h3>
    <p class="desc">Average angle each set's edges miss their vanishing point by, 10-box rolling average. Lower is better; the highest line is the set to focus on.</p>
    <div class="legend">${['L', 'R', 'V'].map(k => `<span><i style="background:var(${SET_INFO[k].css})"></i>${SET_INFO[k].name}</span>`).join('')}</div>
    <div class="plot" id="chSets"></div></div>`;

  // blocks of 25
  const rows = [];
  for (let b = 0; b < n; b += 25) {
    const blk = H.slice(b, b + 25);
    const setAvg = ['L', 'R', 'V'].map(k => [k, avgOf(blk.filter(h => h.sets && h.sets[k] != null).map(h => h.sets[k]))]).filter(x => x[1] != null);
    const weakest = setAvg.length ? setAvg.reduce((a, c) => c[1] > a[1] ? c : a) : null;
    const dv = avgOf(withDiv(blk).map(h => h.div)), wb = avgOf(blk.filter(h => h.wob != null).map(h => h.wob));
    rows.push(`<tr><td>${b + 1}–${b + blk.length}</td><td>${Math.round(avgOf(blk.map(h => h.score)))} ${letterFor(Math.round(avgOf(blk.map(h => h.score))))}</td>
      <td>${avgOf(blk.map(h => h.err)).toFixed(2)}°</td><td>${dv == null ? '–' : dv.toFixed(1)}</td>
      <td>${weakest ? `<span class="chip" style="background:var(${SET_INFO[weakest[0]].css})"></span>${SET_INFO[weakest[0]].name} ${weakest[1].toFixed(1)}°` : '–'}</td>
      <td>${wb == null ? '–' : wb.toFixed(1) + ' px'}</td><td>${fmtDate(blk[0].t)}</td></tr>`);
  }
  html += `<div class="chart"><h3>Every 25 boxes</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Boxes</th><th>Avg score</th><th>Mean error</th><th>Diverging / box</th><th>Weakest set</th><th>Wobble</th><th>Started</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table></div></div>`;

  // gallery
  const thumbs = [];
  for (let i = n - 1; i >= 0; i--) {
    const h = H[i];
    if (!h.seg) continue;
    let mx = 0, my = 0;
    for (let k = 0; k < h.seg.length; k += 2) { mx = Math.max(mx, h.seg[k]); my = Math.max(my, h.seg[k + 1]); }
    const side = Math.max(mx, my) + 16, ox = (side - mx) / 2 - 8, oy = (side - my) / 2 - 8;
    let lines = '';
    for (let e = 0; e < 12; e++) {
      const [ax, ay, bx, by] = h.seg.slice(e * 4, e * 4 + 4);
      const key = h.k ? h.k[e] : null;
      lines += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${key ? `var(${SET_INFO[key].css})` : 'var(--ink)'}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`;
    }
    thumbs.push(`<button type="button" class="thumb${h.div ? ' div' : ''}" data-i="${i}" aria-label="Box ${i + 1}, score ${h.score}">
      <svg viewBox="${-8 - ox} ${-8 - oy} ${side} ${side}" fill="none">${lines}</svg>
      <span>#${i + 1}<b>${h.score}</b></span></button>`);
  }
  if (thumbs.length) html += `<div class="chart"><h3>Gallery</h3>
    <p class="desc">Newest first. Open a box to re-grade it and see its extensions again. × marks boxes with diverging edges.</p>
    <div class="gallery">${thumbs.join('')}</div></div>`;

  html += `<div class="row"><button type="button" class="linkish" id="resetBtn">${state.confirmReset ? 'Tap again to erase every saved box' : 'Erase all progress'}</button></div></div>`;
  prog.innerHTML = html;

  const scores = H.map(h => h.score);
  const lo = Math.max(0, Math.min(50, Math.floor(Math.min(...scores) / 10) * 10));
  const grades = [[90, 'A 90'], [80, 'B 80'], [70, 'C 70'], [60, 'D 60'], [100, '100'], [50, '50'], [40, '40'], [30, '30'], [20, '20'], [10, '10'], [0, '0']]
    .filter(([v]) => v >= lo).map(([v, label]) => ({ v, label }));
  const roll = rolling(scores, 10);
  lineChart(document.getElementById('chScore'), {
    n, yMin: lo, yMax: 100, yTicks: grades, yFmt: v => v,
    series: [{ vals: scores, color: 'var(--muted)', kind: 'dot' }, { vals: roll, color: 'var(--ink)', kind: 'line' }],
    marks: n >= GOAL ? [{ at: GOAL, label: String(GOAL) }] : [],
    tip: (i) => `Box ${i + 1} · ${fmtDate(H[i].t)}<br>score ${H[i].score} (${letterFor(H[i].score)}) · ${H[i].err.toFixed(2)}°${H[i].div ? `<br>${H[i].div} diverging` : ''}<br>10-box avg ${roll[i].toFixed(1)}`,
  });
  if (hasSets) {
    const per = Object.fromEntries(['L', 'R', 'V'].map(k => [k, rolling(H.map(h => h.sets ? h.sets[k] : null), 10)]));
    const top = Math.max(2, ...Object.values(per).flat().filter(v => v != null)) * 1.15;
    const step = top > 8 ? 2 : top > 4 ? 1 : 0.5;
    const ticks = []; for (let v = 0; v <= top; v += step) ticks.push({ v });
    lineChart(document.getElementById('chSets'), {
      n, yMin: 0, yMax: top, yTicks: ticks, yFmt: v => v + '°', endLabels: true,
      series: ['L', 'R', 'V'].map(k => ({ vals: per[k], color: `var(${SET_INFO[k].css})`, kind: 'line', label: SET_INFO[k].name.replace(' set', '') })),
      marks: n >= GOAL ? [{ at: GOAL, label: String(GOAL) }] : [],
      tip: (i) => `Box ${i + 1}, 10-box avg<br>` + ['L', 'R', 'V'].map(k => `${SET_INFO[k].name.padEnd(13)} ${per[k][i] == null ? '–' : per[k][i].toFixed(2) + '°'}`).join('<br>'),
    });
  }
  wireProg();
}

function wireProg() {
  document.getElementById('closeProg').onclick = () => toggleProgress(false);
  prog.querySelectorAll('.thumb').forEach(b => b.onclick = () => reviewBox(+b.dataset.i));
  const rs = document.getElementById('resetBtn');
  if (rs) rs.onclick = () => {
    if (!state.confirmReset) { state.confirmReset = true; renderProgress(); setTimeout(() => { state.confirmReset = false; if (!prog.hidden) renderProgress(); }, 3000); return; }
    state.confirmReset = false; history = []; saveHistory(history); state.savedIndex = null; renderProgress(); update(); toast('Progress erased.');
  };
}

function reviewBox(i) {
  const h = history[i];
  const r = stage.getBoundingClientRect();
  let mx = 0, my = 0;
  for (let k = 0; k < h.seg.length; k += 2) { mx = Math.max(mx, h.seg[k]); my = Math.max(my, h.seg[k + 1]); }
  const ox = r.width * 0.42 - mx / 2, oy = r.height / 2 - my / 2;
  clearAll();
  state.view = { s: 1, r: 0, tx: 0, ty: 0 };
  state.lines = [];
  for (let e = 0; e < 12; e++) {
    const [ax, ay, bx, by] = h.seg.slice(e * 4, e * 4 + 4);
    const a = { x: ax + ox, y: ay + oy }, b = { x: bx + ox, y: by + oy };
    state.lines.push({ pts: [a, b], a, b, wobble: 0, len: Math.hypot(bx - ax, by - ay) });
  }
  state.review = i;
  state.result = analyze(state.lines);
  if (h.wob != null) state.result.wobble = h.wob;
  prog.hidden = true;
  update();
}

// Expose for testing.
window.__boxdrill = { analyze, fitStroke, sampleBox, state, grade, toggleProgress, get history() { return history; } };

// Open on a graded sample so the first view shows what the drill does.
requestAnimationFrame(() => { resize(); showSample(); });
})();
</script>
