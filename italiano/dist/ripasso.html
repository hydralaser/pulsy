<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ripasso Italiano</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: one thumb-reachable column; in study mode the prompt floats up and the answers sit low in the dock. */
:root {
  --bg: #eef2f7;          /* cool paper, tinted toward the cobalt */
  --surface: #ffffff;
  --ink: #13213f;         /* maiolica blue-black */
  --muted: #5b6680;
  --line: #d9e0ea;
  --accent: #1f4fa3;      /* cobalt */
  --accent-ink: #ffffff;
  --lemon: #f3c63a;       /* Amalfi lemon, used sparingly */
  --lemon-soft: #fbefc4;
  --good: #16794f; --good-bg: #e2f4ea;
  --bad: #b8322f; --bad-bg: #fbe5e3;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1322; --surface: #161e31; --ink: #e7ecf6; --muted: #98a3bb; --line: #27324a;
    --accent: #86a8f2; --accent-ink: #0d1322; --lemon: #f5cf4c; --lemon-soft: #3b3420;
    --good: #4fca92; --good-bg: #12301f; --bad: #f2807a; --bad-bg: #3a1a1c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1322; --surface: #161e31; --ink: #e7ecf6; --muted: #98a3bb; --line: #27324a;
  --accent: #86a8f2; --accent-ink: #0d1322; --lemon: #f5cf4c; --lemon-soft: #3b3420;
  --good: #4fca92; --good-bg: #12301f; --bad: #f2807a; --bad-bg: #3a1a1c; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.45 var(--body); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 2rem; font-weight: 700; }
h2 { font-size: 1.05rem; font-weight: 650; }
h2 small { display: block; font: 400 .85rem var(--body); color: var(--muted); margin-top: 2px; }
.sub { margin: 4px 0 0; color: var(--muted); }
.fine { color: var(--muted); font-size: .9rem; margin: 0; }
.eyebrow { text-transform: uppercase; letter-spacing: .09em; font-size: .78rem; font-weight: 700; color: var(--muted); margin: 0; }
.it { font-family: var(--body); }
mark { background: var(--lemon); color: #13213f; border-radius: 3px; padding: 0 1px; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#app { max-width: 560px; margin: 0 auto; min-height: 100%; }
.page {
  display: flex; flex-direction: column; gap: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px));
}

/* bottom tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tab { flex: 1; max-width: 140px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); font-size: .75rem; border-radius: 10px; cursor: pointer; }
.tab.on { color: var(--accent); font-weight: 700; }

/* home */
.masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.masthead h1 { font-size: 2.6rem; letter-spacing: -0.03em; }
.masthead h1::after { content: ""; display: block; width: 44px; height: 6px; border-radius: 3px; background: var(--lemon); margin-top: 6px; }
.streak { text-align: center; min-width: 72px; }
.streak b { display: block; font: 700 1.9rem/1 var(--display); color: var(--accent); }
.streak span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.bignums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bignums div { display: flex; flex-direction: column; }
.bignums b { font: 700 2.1rem/1 var(--display); font-variant-numeric: tabular-nums; }
.bignums span { font-size: .8rem; color: var(--muted); margin-top: 4px; }
.segs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; flex-wrap: wrap; }
.seg { flex: 1; border: 0; background: none; padding: 9px 8px; border-radius: 9px; cursor: pointer; color: var(--muted); font-size: .92rem; min-height: 40px; white-space: nowrap; }
.seg.on { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--r); min-height: 58px; padding: 0 20px; font-weight: 700; font-size: 1.1rem; cursor: pointer; width: 100%; }
.primary:disabled { opacity: .45; cursor: default; }
.primary:active:not(:disabled) { transform: scale(.985); }
.ghost { background: none; border: 1.5px solid var(--line); border-radius: var(--r); min-height: 50px; padding: 0 16px; cursor: pointer; font-weight: 600; width: 100%; }
.danger { background: none; border: 1.5px solid var(--bad); color: var(--bad); border-radius: var(--r); min-height: 50px; padding: 0 16px; cursor: pointer; font-weight: 600; width: 100%; }
.armed { background: var(--bad); color: var(--surface); }
.ghost.armed { border-color: var(--bad); }
.block { display: flex; flex-direction: column; gap: 12px; }
.forecast { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 96px; }
.fc { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; }
.fcb { width: 100%; max-width: 34px; background: var(--accent); border-radius: 6px 6px 2px 2px; opacity: .85; }
.fc:first-child .fcb { background: var(--lemon); opacity: 1; }
.fc small { font-size: .72rem; color: var(--ink); font-variant-numeric: tabular-nums; min-height: 1em; }
.fc span { font-size: .72rem; color: var(--muted); }
.stats2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stats2 div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; }
.stats2 b { font: 700 1.6rem/1 var(--display); font-variant-numeric: tabular-nums; }
.stats2 span { font-size: .82rem; color: var(--muted); margin-top: 4px; }

/* sets */
.pagehead { display: flex; flex-direction: column; gap: 2px; }
.pagehead.withback { flex-direction: row; align-items: flex-start; gap: 6px; }
.pagehead.withback > div { min-width: 0; }
.iconbtn { background: none; border: 0; width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
.iconbtn.inline { width: 40px; height: 40px; vertical-align: middle; color: var(--accent); }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.l { background: var(--accent); opacity: .45; } .m { background: var(--accent); }
.sets { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.setrow { display: flex; align-items: center; gap: 8px; padding-right: 14px; }
.setrow + .setrow { border-top: 1px solid var(--line); }
.setmain { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 14px; display: grid; gap: 6px; cursor: pointer; }
.setname { font-weight: 700; }
.setmeta { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.tense { display: flex; flex-direction: column; gap: 10px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 16px; transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--lemon); outline-offset: 2px; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 6px 0; cursor: pointer; }
.trow small { display: block; color: var(--muted); font-size: .85rem; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.wordlist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.wordlist li + li { border-top: 1px solid var(--line); }
.wordlist button { width: 100%; background: none; border: 0; display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; text-align: left; cursor: pointer; min-height: 52px; }
.wordlist .it { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.wordlist .en { color: var(--muted); font-size: .92rem; min-width: 0; }
.tag { font-style: normal; font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); font-variant-numeric: tabular-nums; }
.tag.lrn { background: var(--lemon-soft); color: var(--ink); }
.tag.ok { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.tag.mat { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
.ctabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ctab { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.ctab h3 { font-size: .95rem; margin-bottom: 6px; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 400; color: var(--muted); padding: 3px 10px 3px 0; width: 38%; white-space: nowrap; }
td { padding: 3px 0; font-weight: 700; }
td button { background: none; border: 0; padding: 4px 0; cursor: pointer; font-weight: 700; text-align: left; }
tr.cur td, tr.cur th { color: var(--accent); }
tr.cur th::before { content: "▸ "; }
textarea { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; resize: vertical; }
.result { margin: 0; font-size: .9rem; color: var(--accent); }
.result:empty { display: none; }
.stepper { display: flex; align-items: center; gap: 18px; }
.stepper button { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.5rem; cursor: pointer; }
.stepper b { font: 700 2rem var(--display); min-width: 2.2ch; text-align: center; font-variant-numeric: tabular-nums; }

/* study */
body[data-view="study"] #app { height: 100%; }
.study {
  height: 100%; overflow-y: auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(16px + env(safe-area-inset-bottom, 0px));
}
.studytop { display: flex; align-items: center; gap: 10px; }
.progress { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--lemon); border-radius: 4px; transition: width .3s; }
.count { font-size: .85rem; color: var(--muted); min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; padding: 24px 0; min-height: 180px; }
.prompt { font: 700 clamp(1.9rem, 8vw, 2.6rem)/1.15 var(--body); margin: 0; overflow-wrap: anywhere; }
.prompt.en { font-family: var(--display); }
.gloss { font-size: 1.3rem; color: var(--muted); margin: 0; }
.verbline { margin: 0; color: var(--muted); }
.verbline b { color: var(--ink); }
.blank { display: inline-block; min-width: 3ch; border-bottom: 3px solid var(--lemon); color: var(--accent); }
.bigspeak { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; }
.bigspeak .ic { width: 52px; height: 52px; }
.dock { display: flex; flex-direction: column; gap: 10px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 16px; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); cursor: pointer; font-size: 1.15rem;
  transition: border-color .15s, background .15s, opacity .15s;
}
.opt.it span { font-weight: 700; }
.opt kbd { font: 600 .75rem var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; width: 24px; height: 24px; display: grid; place-items: center; flex: none; }
.opt:active { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.dim { opacity: .45; }
.answered .opt { pointer-events: none; }
.fb { border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.fb.good { background: var(--good-bg); }
.fb.bad { background: var(--bad-bg); }
.fb p { margin: 0; }
.verdict { font: 700 .8rem var(--body); text-transform: uppercase; letter-spacing: .08em; }
.good .verdict { color: var(--good); } .bad .verdict { color: var(--bad); }
.answer { font-size: 1.15rem; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.answer span { color: var(--muted); }
.why { font-size: .95rem; }
table.mini { margin-top: 6px; font-size: .95rem; }
table.mini.intro { max-width: 300px; font-size: 1.1rem; text-align: left; }
.next { margin-top: 2px; }
.answered .opts { display: none; }
@media (min-height: 760px) { .answered .opts { display: flex; } }
@media (hover: none) { .opt kbd { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* done */
.done { display: flex; flex-direction: column; gap: 18px; padding-top: 12vh; }
.done h1 { font-size: 2.8rem; }
</style></head>
<body>
<div id="app"></div>
<script>
(() => {
// Vocabulary + verb data. Format per word: "italian|english|pos"
// pos: n = noun, v = verb, a = adjective, x = other (adverb, phrase, number...)

const WORD_SETS = [

    'il pollo|chicken|n', 'il sale|salt|n', 'lo zucchero|sugar|n', 'la colazione|breakfast|n',
    'il pranzo|lunch|n', 'la cena|dinner|n', 'il ristorante|restaurant|n', 'il conto|bill|n',
    'il bicchiere|glass (for drinking)|n', 'il piatto|plate / dish|n', 'la forchetta|fork|n',
  ]},
  { id: 'time', name: 'Time & days', words: [

  { id: 'numbers', name: 'Numbers', words: [

    'sette|seven|x', 'otto|eight|x', 'nove|nine|x', 'dieci|ten|x', 'undici|eleven|x', 'dodici|twelve|x',
    'venti|twenty|x', 'trenta|thirty|x', 'cento|hundred|x', 'mille|thousand|x', 'primo|first|a',

  { id: 'adjectives', name: 'Describing things', words: [

    'brutto|ugly|a', 'nuovo|new|a', 'vecchio|old|a', 'giovane|young|a', 'caldo|hot|a', 'freddo|cold|a',

  { id: 'body', name: 'Colours & body', words: [

// ---------------- text helpers ----------------
const ARTICLE = /^(il|lo|la|i|gli|le|un|una|uno|l'|un')\s*/i;
const stripArticle = s => s.replace(ARTICLE, '');
const norm = s => stripArticle(s.trim().toLowerCase())
  .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’]/g, "'");
const undouble = s => s.replace(/(.)\1/g, '$1');
const glossItems = en => en.toLowerCase().replace(/\(.*?\)/g, '').split(/[\/,;]/)
  .map(x => x.trim().replace(/^to /, '')).filter(Boolean);

function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

// How "sound-alike" two Italian words are (0..1).
function similarity(a, b) {
  const x = norm(a), y = norm(b);
  if (x === y) return 0;
  if (undouble(x) === undouble(y)) return 0.97;           // penna / pena
  const d = lev(x, y), L = Math.max(x.length, y.length);
  let s = 1 - d / L;
  if (d === 1) s += 0.25;                                  // nove / nave
  if (x.slice(0, 3) === y.slice(0, 3)) s += 0.08;
  if (x.slice(-3) === y.slice(-3)) s += 0.05;
  return d > 3 ? 0 : Math.min(s, 0.95);
}

const glossConflict = (a, b) => {
  const A = glossItems(a.en), B = glossItems(b.en);
  return A.some(x => B.includes(x)) || norm(a.it) === norm(b.it);
};

const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const pick = arr => arr[Math.random() * arr.length | 0];

// ---------------- conjugation ----------------
const AUX = { a: ['ho', 'hai', 'ha', 'abbiamo', 'avete', 'hanno'], e: ['sono', 'sei', 'è', 'siamo', 'siete', 'sono'] };
const FUT_END = ['ò', 'ai', 'à', 'emo', 'ete', 'anno'];
const COND_END = ['ei', 'esti', 'ebbe', 'emmo', 'este', 'ebbero'];
const IMP_END = ['o', 'i', 'a', 'amo', 'ate', 'ano'];

// join a stem and ending applying -care/-gare (add h) and -iare (merge i) spelling rules
function joinAre(stem, end) {
  if (/[cg]$/.test(stem) && /^[ie]/.test(end)) return stem + 'h' + end;
  if (/i$/.test(stem) && /^i/.test(end)) return stem.slice(0, -1) + end;
  return stem + end;
}

const cache = new Map();
function conjugate(v) {
  if (cache.has(v.inf)) return cache.get(v.inf);
  const cls = v.inf.slice(-3);              // are / ere / ire
  const stem = v.inf.slice(0, -3);
  const T = {};
  const join = cls === 'are' ? joinAre : (s, e) => s + e;

  if (v.pres) T.pres = v.pres;
  else if (cls === 'are') T.pres = ['o', 'i', 'a', 'iamo', 'ate', 'ano'].map(e => join(stem, e));
  else if (v.isc) T.pres = ['isco', 'isci', 'isce', 'iamo', 'ite', 'iscono'].map(e => stem + e);
  else T.pres = ['o', 'i', 'e', 'iamo', cls === 'ere' ? 'ete' : 'ite', 'ono'].map(e => stem + e);

  if (v.imp) T.imp = v.imp;
  else { const s = v.impStem || stem + cls[0] + 'v'; T.imp = IMP_END.map(e => s + e); }

  let fs = v.fut;
  if (!fs) {
    if (cls === 'are') fs = /[cg]i$/.test(stem) ? stem.slice(0, -1) + 'er' : /[cg]$/.test(stem) ? stem + 'her' : stem + 'er';
    else fs = stem + (cls === 'ere' ? 'er' : 'ir');
  }
  T.fut = FUT_END.map(e => fs + e);
  T.cond = COND_END.map(e => fs + e);

  const pp = v.pp || stem + { are: 'ato', ere: 'uto', ire: 'ito' }[cls];
  const aux = v.aux === 'e' ? 'e' : 'a';
  const agree = i => aux === 'e' && i >= 3 ? pp.replace(/o$/, 'i') : pp;
  T.pp = AUX[aux].map((a, i) => a + ' ' + agree(i));
  // the classic mistake: wrong auxiliary
  const other = aux === 'e' ? 'a' : 'e';
  T.ppWrongAux = AUX[other].map((a, i) => a + ' ' + (other === 'e' && i >= 3 ? pp.replace(/o$/, 'i') : pp));

  if (v.cong) T.cong = v.cong;
  else if (cls === 'are') T.cong = ['i', 'i', 'i', 'iamo', 'iate', 'ino'].map(e => join(stem, e));
  else if (v.isc) T.cong = ['isca', 'isca', 'isca', 'iamo', 'iate', 'iscano'].map(e => stem + e);
  else T.cong = ['a', 'a', 'a', 'iamo', 'iate', 'ano'].map(e => stem + e);

  T.pastPart = pp; T.aux = aux;
  cache.set(v.inf, T);
  return T;
}

// ---------------- cards & sets ----------------
const parse = line => { const [it, en, pos] = line.split('|'); return { it, en, pos }; };

function buildDeck(customWords = []) {
  const cards = new Map();
  const sets = [];
  const allWords = [];
  const addWordSet = (id, name, words, custom = false) => {
    const ids = [];
    for (const w of words) {
      const p = typeof w === 'string' ? parse(w) : w;
      const cid = 'w:' + norm(p.it);
      if (!cards.has(cid)) {
        const card = { id: cid, kind: 'word', ...p, set: id };
        cards.set(cid, card); allWords.push(card);
      }
      ids.push(cid);
    }
    sets.push({ id, name, kind: 'word', cards: [...new Set(ids)], custom });
  };
  WORD_SETS.forEach(s => addWordSet(s.id, s.name, s.words));
  if (customWords.length) addWordSet('custom', 'My words', customWords, true);

  for (const t of TENSES) for (const tier of [1, 2, 3]) {
    const ids = [];
    for (const v of VERBS.filter(v => v.tier === tier)) {
      const forms = conjugate(v)[t.id];
      PERSONS.forEach((p, i) => {
        const cid = `c:${v.inf}:${t.id}:${i}`;
        cards.set(cid, { id: cid, kind: 'conj', verb: v, tense: t, person: i, answer: forms[i], set: `${t.id}${tier}` });
        ids.push(cid);
      });
    }
    sets.push({ id: `${t.id}${tier}`, name: `${t.name}: ${VERB_TIERS[tier].toLowerCase()}`, tense: t.id, tier, kind: 'conj', cards: ids });
  }
  const known = new Set(allWords.map(w => norm(w.it)));
  const distractorPool = allWords.concat(CONFUSABLES.map(parse).filter(c => !known.has(norm(c.it))).map(c => ({ ...c, confusable: true })));
  return { cards, sets, allWords, distractorPool };
}

// ---------------- multiple choice ----------------
// near = how many sound-alike / same-verb options to include; grows as a card matures
function nearCountFor(state) {
  const ivl = state?.ivl || 0;
  return ivl < 2 ? 1 : ivl < 10 ? 2 : 3;
}

function wordOptions(deck, card, mode, nearN, n = 4) {
  const pool = deck.distractorPool.filter(c => !glossConflict(c, card));
  const label = c => (mode === 'it-en' ? c.en : c.it);
  const used = new Set([label(card).toLowerCase()]);
  const out = [];
  const take = c => { const l = label(c).toLowerCase(); if (used.has(l)) return false; used.add(l); out.push(c); return true; };

  const near = pool.map(c => [c, similarity(c.it, card.it)]).filter(([, s]) => s >= 0.5)
    .sort((a, b) => b[1] - a[1]).slice(0, 6).map(([c]) => c);
  // listening mode is all about sound-alikes: use as many as we have
  const wantNear = mode === 'listen' ? n - 1 : nearN;
  for (const c of shuffle(near.slice(0, Math.max(wantNear + 1, 3)))) { if (out.length >= wantNear) break; take(c); }
  const samePos = shuffle(pool.filter(c => c.pos === card.pos && !c.confusable));
  const rest = shuffle(pool.filter(c => !c.confusable));
  for (const c of samePos.concat(rest)) { if (out.length >= n - 1) break; take(c); }
  return shuffle([{ ...card, correct: true }, ...out]).map(c => ({ text: label(c), correct: !!c.correct, item: c }));
}

function conjOptions(card, nearN, n = 4) {
  const T = conjugate(card.verb), t = card.tense.id, p = card.person;
  const used = new Set([card.answer]);
  const out = [];
  const take = (text, why) => { if (!text || used.has(text)) return; used.add(text); out.push({ text, why }); };
  const samePerson = shuffle(TENSES.filter(x => x.id !== t).map(x => [T[x.id][p], x.name]));
  const who = (tid, form) => PERSONS.filter((_, i) => T[tid][i] === form).join(' / ');
  const sameTense = shuffle(PERSONS.map((_, i) => [T[t][i], `${card.tense.name}, ${who(t, T[t][i])}`]).filter((_, i) => i !== p));
  const tricky = [];
  if (t === 'pp') tricky.push([T.ppWrongAux[p], `wrong auxiliary: ${card.verb.inf} takes ${T.aux === 'e' ? 'essere' : 'avere'}`]);
  // near = same tense (other person) + typical mistakes; far = same person, other tenses
  const nearList = shuffle(tricky.concat(sameTense));
  for (const [x, w] of nearList) { if (out.length >= nearN) break; take(x, w); }
  for (const [x, w] of samePerson.concat(sameTense)) { if (out.length >= n - 1) break; take(x, w); }
  return shuffle([{ text: card.answer, correct: true }, ...out.map(o => ({ ...o, correct: false }))]);
}

// ---------------- scheduler ----------------
// Answers are graded automatically: wrong = again, slow = hard, fast = good.
const DAY = 864e5;
function schedule(state, grade, now = Date.now()) {
  const s = { ivl: 0, ease: 2.5, reps: 0, lapses: 0, learn: 0, ...state };
  s.last = now;
  if (s.learn !== null && s.learn !== undefined) {
    // learning / relearning: needs two correct answers in a row (within the session)
    if (grade === 'again') { s.learn = 0; s.due = now + 60e3; }
    else if (s.learn === 0) { s.learn = 1; s.due = now + 5 * 60e3; }
    else {
      s.learn = null; s.reps++;
      s.ivl = s.lapses ? Math.max(1, Math.round(s.prevIvl * 0.4)) : (grade === 'hard' ? 1 : 2);
      s.due = now + s.ivl * DAY;
    }
    return s;
  }
  if (grade === 'again') {
    s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2); s.prevIvl = s.ivl; s.learn = 0; s.due = now + 60e3;
    return s;
  }
  // reward late reviews a bit (you remembered it for longer than planned)
  const late = Math.max(0, (now - (s.due || now)) / DAY);
  const base = s.ivl + late / 2;
  let ivl = grade === 'hard' ? Math.max(s.ivl + 1, base * 1.2) : Math.max(s.ivl + 1, base * s.ease);
  if (grade === 'hard') s.ease = Math.max(1.3, s.ease - 0.15);
  ivl *= 0.95 + Math.random() * 0.1;                       // fuzz so cards don't clump
  s.ivl = Math.min(365, Math.round(ivl)); s.reps++;
  s.due = now + s.ivl * DAY;
  return s;
}

// Mark a card as already known (imported progress). Spreads first reviews over a few days.
function knownState(now = Date.now(), days = 7) {
  const ivl = Math.round(days * (0.6 + Math.random() * 0.8));
  return { ivl, ease: 2.5, reps: 1, lapses: 0, learn: null, due: now + ivl * DAY, last: now, imported: true };
}

const isLearned = s => s && s.learn === null && s.ivl >= 1;
const isMature = s => s && s.learn === null && s.ivl >= 21;

}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// mark the letters of `a` that are not shared with `b` (shows the doubled consonant etc.)
// only when the two look alike; otherwise highlighting is just noise
function diffMark(a, b) {
  if (similarity(a, b) < 0.5) return esc(a);
  const m = a.length, n = b.length, L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--)
    L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let out = '', i = 0, j = 0;
  while (i < m) {
    if (j < n && a[i] === b[j]) { out += esc(a[i]); i++; j++; }
    else if (j < n && L[i][j + 1] > L[i + 1][j]) j++;
    else { out += `<mark>${esc(a[i])}</mark>`; i++; }
  }
  return out;
}

function setStats(set) {
  let seen = 0, learned = 0, mature = 0;
  for (const id of set.cards) { const s = S.cards[id]; if (s) { seen++; if (isLearned(s)) learned++; if (isMature(s)) mature++; } }
  return { total: set.cards.length, seen, learned, mature };
}
function counts(scope = { kind: S.settings.scope }) {
  const now = Date.now();
  let due = 0;
  for (const [id, s] of Object.entries(S.cards)) { const c = deck.cards.get(id); if (c && inScope(c, scope) && (s.due <= now || s.learn !== null)) due++; }
  return { due, fresh: Math.min(newLeft(), newPool(scope, 999).length) };
}
function newPool(scope, limit) {
  const sets = deck.sets.filter(s => scope.set ? s.id === scope.set : S.enabled[s.id] && inScope({ kind: s.kind, set: s.id }, scope));
  const words = [], conj = [];
  for (const s of sets) {
    const fresh = s.cards.filter(id => !S.cards[id]);
    (s.kind === 'word' ? words : conj).push(...(s.kind === 'conj' ? shuffle(fresh) : fresh));
  }
  const out = [];
  while ((words.length || conj.length) && out.length < limit) {
    if (words.length) out.push(words.shift());
    if (conj.length && out.length < limit) out.push(conj.shift());
  }
  return out;
}

  return `<section class="done">
    <p class="eyebrow">Session finished</p>
    <h1>${acc >= 90 ? 'Bravissimo!' : acc >= 70 ? 'Ben fatto!' : 'Avanti così!'}</h1>
    <div class="bignums">
      <div><b>${s.answered}</b><span>answers</span></div>
      <div><b>${acc}%</b><span>correct</span></div>
      <div><b>${s.newSeen || 0}</b><span>new cards</span></div>
    </div>
    ${when ? `<p class="fine">Next card is due in ${when}.</p>` : ''}
    <div class="actions">
      ${due + fresh ? `<button class="primary" data-a="start">Keep going (${due + fresh})</button>` : `<button class="primary" data-a="more">Learn 5 more</button>`}
      <button class="ghost" data-a="go" data-v="home">Back to today</button>
    </div></section>`;
}

// ---------------- study session ----------------
function startSession(scope) {
  const now = Date.now();
  const reviews = Object.entries(S.cards)
    .filter(([id, s]) => { const c = deck.cards.get(id); return c && inScope(c, scope) && (s.due <= now || s.learn !== null); })
    .sort((a, b) => a[1].due - b[1].due).map(([id]) => id).slice(0, 150);
  const limit = scope.set ? Math.max(newLeft(), 10) : newLeft();
  const fresh = newPool(scope, limit);
  const queue = [];
  while (reviews.length || fresh.length) {
    queue.push(...reviews.splice(0, 3));
    if (fresh.length) queue.push(fresh.shift());
  }
  if (!queue.length) return go('home');
  sess = { queue, i: 0, answered: 0, correct: 0, newSeen: 0, introduced: new Set(), seenTense: new Set(), scope };
  view = { name: 'study' };
  present();
}

function pickMode(card, state) {
  if (card.kind === 'conj') return 'conj';
  const dir = S.settings.direction;
  if (dir !== 'mixed') return dir;
  if (!state || (state.learn === 0 && !state.reps && !state.lapses)) return 'it-en';
  if (state.learn === 1) return 'en-it';
  const r = Math.random();
  if (S.settings.listen && itVoice && r < 0.2) return 'listen';
  return r < 0.6 ? 'it-en' : 'en-it';
}

function present() {
  clearTimeout(advanceTimer);
  if (sess.i >= sess.queue.length) { view = { name: 'done' }; return render(); }
  const id = sess.queue[sess.i];
  const card = deck.cards.get(id);
  const state = S.cards[id];
  const tenseKey = card.kind === 'conj' && `${card.verb.inf}:${card.tense.id}`;
  const isNew = !state;
  const needsIntro = isNew && !sess.introduced.has(id) &&
    (card.kind === 'word' || !(sess.seenTense.has(tenseKey) || Object.keys(S.cards).some(k => k.startsWith(`c:${tenseKey}:`))));
  if (tenseKey) sess.seenTense.add(tenseKey);
  if (needsIntro) { sess.cur = { id, card, intro: true }; renderStudy(); if (card.kind === 'word' && S.settings.autoplay) speak(card.it); return; }
  const mode = pickMode(card, state);
  const nearN = nearCountFor(state);
  const options = card.kind === 'conj' ? conjOptions(card, nearN) : wordOptions(deck, card, mode, nearN);
  sess.cur = { id, card, mode, options, t0: performance.now(), answered: false };
  renderStudy();
  if (S.settings.autoplay && (mode === 'it-en' || mode === 'listen')) speak(card.it);
}

function promptHTML(c) {
  const { card, mode } = c;
  if (card.kind === 'conj') {
    const p = PERSONS[card.person];
    return `<p class="eyebrow">${card.tense.name}</p>
      <p class="verbline"><b>${card.verb.inf}</b> · ${esc(card.verb.en)}</p>
      <p class="prompt it">${card.tense.id === 'cong' ? 'che ' : ''}${p} <span class="blank">${c.answered ? esc(card.answer) : '…'}</span></p>`;
  }
  if (mode === 'listen') return `<p class="eyebrow">Which word did you hear?</p>
      <button class="bigspeak" data-a="say" data-v="${esc(card.it)}" aria-label="Play again">${icon('speaker')}</button>
      ${c.answered ? `<p class="prompt it">${esc(card.it)}</p>` : '<p class="fine">Tap to hear it again</p>'}`;
  if (mode === 'it-en') return `<p class="eyebrow">What does it mean?</p>
      <p class="prompt it">${esc(card.it)} <button class="iconbtn inline" data-a="say" data-v="${esc(card.it)}" aria-label="Hear it">${icon('speaker')}</button></p>`;
  return `<p class="eyebrow">How do you say</p><p class="prompt en">${esc(card.en)}</p>`;
}

function feedbackHTML(c) {
  const { card, chosen } = c;
  const ok = chosen.correct;
  if (card.kind === 'conj') {
    const T = conjugate(card.verb), t = card.tense.id;
    const why = ok ? '' : `<p class="why">You picked <b class="it">${diffMark(chosen.text, card.answer)}</b>${chosen.why ? ` (${esc(chosen.why)})` : ''}</p>`;
    const table = ok ? '' : `<table class="mini">${PERSONS.map((p, i) => `<tr class="${i === card.person ? 'cur' : ''}"><th>${t === 'cong' ? 'che ' + p : p}</th><td>${esc(T[t][i])}</td></tr>`).join('')}</table>`;
    return `<div class="fb ${ok ? 'good' : 'bad'}"><p class="verdict">${ok ? 'Giusto' : 'Not quite'}</p>
      <p class="answer it">${card.tense.id === 'cong' ? 'che ' : ''}${PERSONS[card.person]} <b>${ok ? esc(card.answer) : diffMark(card.answer, chosen.text)}</b></p>${why}${table}</div>`;
  }
  const other = chosen.item;
  const why = ok ? '' : `<p class="why"><b class="it">${diffMark(other.it, card.it)}</b> means “${esc(other.en)}”</p>`;
  return `<div class="fb ${ok ? 'good' : 'bad'}"><p class="verdict">${ok ? 'Giusto' : 'Not quite'}</p>
    <p class="answer"><b class="it">${ok ? esc(card.it) : diffMark(card.it, other.it)}</b> <span>${esc(card.en)}</span>
    <button class="iconbtn inline" data-a="say" data-v="${esc(card.it)}" aria-label="Hear it">${icon('speaker')}</button></p>${why}</div>`;
}

function renderStudy() {
  document.body.dataset.view = 'study';
  const c = sess.cur, total = sess.queue.length;
  const pct = Math.round(100 * sess.i / total);
  const top = `<div class="studytop"><button class="iconbtn" data-a="quit" aria-label="End session">${icon('close')}</button>
    <div class="progress"><i style="width:${pct}%"></i></div><span class="count">${total - sess.i}</span></div>`;
  let main, bottom;
  if (c.intro) {
    const card = c.card;
    if (card.kind === 'word') {
      main = `<p class="eyebrow">New word</p><p class="prompt it">${esc(card.it)} <button class="iconbtn inline" data-a="say" data-v="${esc(card.it)}" aria-label="Hear it">${icon('speaker')}</button></p><p class="gloss">${esc(card.en)}</p>`;
    } else {
      main = `<p class="eyebrow">New: ${card.tense.name}</p><p class="verbline"><b>${card.verb.inf}</b> · ${esc(card.verb.en)}</p>
        ${tenseTable(card.verb, card.tense, card.person)}`;
    }
    bottom = `<button class="primary" data-a="gotit">Got it</button>`;
  } else {
    main = promptHTML(c);
    const opts = c.options.map((o, k) => {
      let cls = 'opt';
      if (c.answered) cls += o.correct ? ' right' : o === c.chosen ? ' wrong' : ' dim';
      const isIt = c.card.kind === 'conj' || c.mode !== 'it-en';
      return `<button class="${cls}${isIt ? ' it' : ''}" data-a="answer" data-v="${k}" ${c.answered ? 'tabindex="-1"' : ''}><kbd>${k + 1}</kbd><span>${esc(o.text)}</span></button>`;
    }).join('');
    bottom = `${c.answered ? feedbackHTML(c) : ''}<div class="opts">${opts}</div>
      ${c.answered ? `<button class="primary next" data-a="next">${c.chosen.correct && S.settings.autoAdvance ? 'Next' : 'Continue'}</button>` : ''}`;
  }
  $app.innerHTML = `<main class="study ${c.answered ? 'answered' : ''}">${top}<div class="stage">${main}</div><div class="dock">${bottom}</div></main>`;
}

function answer(k) {
  const c = sess.cur;
  if (!c || c.intro || c.answered) return;
  const chosen = c.options[k]; if (!chosen) return;
  c.answered = true; c.chosen = chosen;
  const secs = (performance.now() - c.t0) / 1000;
  const slow = c.card.kind === 'conj' ? 9 : c.mode === 'listen' ? 8 : 6;
  const grade = !chosen.correct ? 'again' : secs > slow ? 'hard' : 'good';
  const prev = S.cards[c.id];
  const t = today();
  if (!prev) { t.n++; sess.newSeen++; }
  const next = schedule(prev, grade);
  S.cards[c.id] = next;
  t.r++; if (chosen.correct) t.c++;
  sess.answered++; if (chosen.correct) sess.correct++;
  if (next.learn !== null) {
    const gap = chosen.correct ? 6 : 3;
    sess.queue.splice(Math.min(sess.queue.length, sess.i + 1 + gap), 0, c.id);
  }
  save();
  buzz(chosen.correct ? 12 : [40, 50, 40]);
  renderStudy();
  if (S.settings.autoplay && c.card.kind === 'word' && c.mode !== 'listen' && c.mode !== 'it-en') speak(c.card.it);
  if (S.settings.autoplay && c.card.kind === 'conj') speak((c.card.tense.id === 'cong' ? 'che ' : '') + PERSONS[c.card.person].replace('lui/lei', 'lui') + ' ' + c.card.answer);
  if (chosen.correct && S.settings.autoAdvance) advanceTimer = setTimeout(advance, 1300);
}
function advance() { clearTimeout(advanceTimer); if (!sess?.cur?.answered) return; sess.i++; present(); }

// ---------------- actions ----------------
let confirmTimer = null;
const actions = {
  go: el => go(el.dataset.v),
  scope: el => { S.settings.scope = el.dataset.v; save(); render(); },
  start: () => startSession({ kind: S.settings.scope }),
  more: () => { today().bonus = (today().bonus || 0) + 5; save(); startSession({ kind: S.settings.scope }); },
  studyset: el => startSession({ set: el.dataset.v }),
  openset: el => go({ name: 'set', id: el.dataset.v, parent: setOf(el.dataset.v).kind === 'word' ? 'words' : 'verbs' }),
  openverb: el => go({ name: 'verb', id: el.dataset.v, parent: 'verbs' }),
  toggle: el => { S.enabled[el.dataset.v] = el.checked; save(); },
  settog: el => { S.settings[el.dataset.k] = el.checked; save(); },
  set: el => { S.settings[el.dataset.k] = el.dataset.v; save(); render(); },
  step: el => { S.settings.newPerDay = Math.max(0, Math.min(50, S.settings.newPerDay + +el.dataset.v)); save(); render(); },
  say: el => speak(el.dataset.v),
  answer: el => answer(+el.dataset.v),
  next: () => advance(),
  gotit: () => { const c = sess.cur; sess.introduced.add(c.id); sess.queue.splice(Math.min(sess.queue.length, sess.i + 3), 0, c.id); sess.i++; present(); },
  quit: () => { view = { name: sess.answered ? 'done' : 'home' }; render(); },
  confirm: el => {
    if (el.dataset.armed) { clearTimeout(confirmTimer); return actions[el.dataset.do](el); }
    el.dataset.armed = '1'; el.textContent = 'Tap again to confirm'; el.classList.add('armed');
    confirmTimer = setTimeout(() => { delete el.dataset.armed; el.textContent = el.dataset.label; el.classList.remove('armed'); }, 3500);
  },
  markset: el => {
    const s = setOf(el.dataset.v); let n = 0;
    for (const id of s.cards) if (!isLearned(S.cards[id])) { S.cards[id] = knownState(); n++; }
    save(); render();
  },
  resetset: el => { for (const id of setOf(el.dataset.v).cards) delete S.cards[id]; save(); render(); },
  resetall: () => { S = defaults(); save(); rebuildDeck(); go('home'); },
  importknown: () => {
    const raw = document.getElementById('importKnown').value;
    const tokens = raw.split(/[\n,;\t]+/).map(t => t.split(/\s[=\-–—:]\s|=/)[0].trim()).filter(Boolean);
    const byNorm = new Map(deck.allWords.map(w => [norm(w.it), w]));
    let marked = 0, already = 0; const missing = [];
    for (const t of tokens) {
      const w = byNorm.get(norm(t));
      if (!w) { missing.push(t); continue; }
      if (isLearned(S.cards[w.id])) { already++; continue; }
      S.cards[w.id] = knownState(); marked++;
    }
    save();
    document.getElementById('importResult').textContent =
      `Marked ${plural(marked, 'word')} as known${already ? `, ${already} already learned` : ''}.` +
      (missing.length ? ` Not in the word sets (${missing.length}): ${missing.slice(0, 12).join(', ')}${missing.length > 12 ? '…' : ''}. Add them below with a translation.` : '');
  },
  addcustom: () => {
    const lines = document.getElementById('customWords').value.split('\n').map(l => l.trim()).filter(Boolean);
    let added = 0; const bad = [];
    const have = new Set(deck.allWords.map(w => norm(w.it)));
    for (const l of lines) {
      const m = l.split(/\s*[=\t]\s*|\s+[-–—]\s+/);
      if (m.length < 2 || !m[0] || !m[1]) { bad.push(l); continue; }
      if (have.has(norm(m[0]))) continue;
      S.custom.push({ it: m[0], en: m.slice(1).join(' / '), pos: 'x' }); have.add(norm(m[0])); added++;
    }
    if (added) S.enabled.custom = true;
    save(); rebuildDeck();
    document.getElementById('customWords').value = bad.join('\n');
    document.getElementById('customResult').textContent = `Added ${plural(added, 'word')}.` + (bad.length ? ` ${bad.length} line(s) need an "=" between Italian and English.` : '');
  },
  export: async () => {
    const data = JSON.stringify(S);
    const box = document.getElementById('backup'), out = document.getElementById('backupResult');
    try { await navigator.clipboard.writeText(data); out.textContent = 'Backup copied. Paste it somewhere safe, or into Settings on your other device.'; }
    catch (e) { box.value = data; box.select(); out.textContent = 'Copying is blocked here, so the backup is in the box above. Select all and copy it.'; }
  },
  import: () => {
    const out = document.getElementById('backupResult');
    try {
      const d = JSON.parse(document.getElementById('backup').value);
      if (!d || typeof d.cards !== 'object') throw new Error();
      const def = defaults();
      S = { ...def, ...d, settings: { ...def.settings, ...d.settings } }; save(); rebuildDeck();
      out.textContent = `Restored ${plural(Object.keys(S.cards).length, 'card')}.`;
    } catch (e) { out.textContent = 'That doesn\'t look like a Ripasso backup. Paste the whole text you copied.'; }
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT') return;
  const fn = actions[el.dataset.a]; if (fn) fn(el);
});
document.addEventListener('change', e => {
  const el = e.target.closest('input[data-a]'); if (el) actions[el.dataset.a]?.(el);
});
document.addEventListener('keydown', e => {
  if (view.name !== 'study' || e.target.tagName === 'TEXTAREA') return;
  const c = sess?.cur; if (!c) return;
  if (c.intro && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); actions.gotit(); return; }
  if (!c.answered && /^[1-9]$/.test(e.key)) answer(+e.key - 1);
  else if (c.answered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); advance(); }
});

render();
if (window.RIPASSO_SW && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

})();
</script>
</body></html>
